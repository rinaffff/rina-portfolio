<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rina Benamar — Multidisciplinary Art Director & Brand Architect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Caveat:wght@400;500;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=IM+Fell+English:ital@0;1&family=Noto+Serif+JP:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --peach: #FFF9ED; 
      --espresso: #351E28;
      --plum: #5B1E32;
      --plum-soft: #4D3449;
      --olive: #6C6A43;
      --pink: #CB438B;
      --rose: #BF3556;
      --mint: #B7E1DA;
      --line: rgba(53,30,40,.13);
      --red-line: rgba(203, 67, 139, 0.25);

      --f-disp: 'Bodoni Moda', Georgia, serif;
      --f-ser: 'IM Fell English', Georgia, serif;
      --f-body: 'DM Sans', sans-serif;
      --f-jp: 'Noto Serif JP', serif;
      --f-hand: 'Caveat', cursive;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--peach);
      color: var(--espresso);
      font-family: var(--f-body);
      font-weight: 300;
      line-height: 1.7;
      cursor: default;
      overflow-x: hidden;
      position: relative;
    }

    /* Red vertical guideline */
    body::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      left: clamp(1.2rem, 5vw, 4rem);
      width: 1px;
      background: var(--red-line);
      z-index: 10;
      pointer-events: none;
    }

    /* Grain texture overlay */
    body::after {
      content: "";
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: .036; pointer-events: none; z-index: 9000;
    }

    /* CURSOR */
    @media (pointer: fine) {
      body { cursor: none; }
      #cursor {
        position: fixed; width: 9px; height: 9px;
        background: var(--pink); border-radius: 50%;
        pointer-events: none; z-index: 9999;
        transform: translate(-50%, -50%);
        transition: width .35s var(--ease), height .35s var(--ease), background .3s;
        mix-blend-mode: multiply;
      }
      #cursor.big { width: 50px; height: 50px; background: var(--mint); opacity: .65; }
      #cursor-ring {
        position: fixed; width: 32px; height: 32px;
        border: 1.5px solid rgba(203,67,139,.3); border-radius: 50%;
        pointer-events: none; z-index: 9998;
        transform: translate(-50%, -50%);
        transition: left .14s var(--ease), top .14s var(--ease);
      }
    }

    /* NAV */
    nav {
      padding: 2.5rem clamp(2rem, 7vw, 5rem) 1rem clamp(2.5rem, 8vw, 6rem);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative; z-index: 100;
    }

    .logo {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      line-height: 1.25;
    }
    .logo-en { 
      font-family: var(--f-disp); 
      font-size: clamp(1.1rem, 2vw, 1.4rem); 
      font-weight: 400; 
      letter-spacing: .25em; 
      text-transform: uppercase; 
      color: var(--espresso); 
    }
    .logo-jp { 
      font-family: var(--f-jp); 
      font-size: .65rem; 
      font-weight: 300; 
      letter-spacing: .35em; 
      color: var(--plum-soft); 
      opacity: .75; 
      margin-top: .2rem;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 2.5rem;
      align-items: center;
      margin-left: auto;
    }
    .nav-links a { font-size: .65rem; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; color: var(--plum-soft); transition: color .3s; }
    .nav-links a:hover { color: var(--pink); }

    /* HERO SECTION */
    #hero {
      min-height: 85vh;
      padding: 1.5rem clamp(2rem, 7vw, 5rem) 3rem clamp(2.5rem, 8vw, 6rem);
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
    }

    /* Vertical Stacked Background Kanji */
    .hero-bg-jp {
      position: absolute; right: 3vw; top: 5%;
      font-family: var(--f-jp);
      font-size: clamp(12rem, 22vw, 26rem);
      font-weight: 200; 
      color: rgba(91, 30, 50, 0.06);
      pointer-events: none; 
      line-height: 0.9; 
      user-select: none;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-content {
      position: relative; z-index: 2;
      max-width: 1100px;
      margin-top: 1rem;
    }

    .hero-job-title {
      font-family: var(--f-hand);
      font-size: clamp(1.8rem, 3.2vw, 2.6rem);
      color: var(--pink);
      font-weight: 400;
      margin-bottom: 1.2rem;
      line-height: 1.1;
    }

    .hero-h1 {
      font-family: var(--f-disp);
      font-size: clamp(3.8rem, 8vw, 7.5rem);
      font-weight: 400; 
      line-height: 0.95; 
      letter-spacing: -.03em;
      margin-bottom: 2.5rem;
      color: var(--espresso);
    }

    .hero-h1 .highlight-pink { color: var(--pink); font-style: normal; }
    .hero-h1 .highlight-olive { color: var(--olive); font-style: italic; }

    .hero-tagline {
      font-family: var(--f-body);
      font-size: .65rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      line-height: 1.8;
      max-width: 520px; 
      color: var(--plum-soft);
      opacity: .85;
    }

    .hero-foot {
      position: relative; z-index: 2;
      display: flex; justify-content: space-between; align-items: flex-end;
      border-top: 1px solid var(--line); padding-top: 1.5rem; margin-top: 3rem;
    }

    .hero-location { font-size: .65rem; letter-spacing: .22em; text-transform: uppercase; color: var(--plum-soft); opacity: .7; }
    .hero-avail { font-size: .65rem; letter-spacing: .22em; text-transform: uppercase; color: var(--pink); font-weight: 400; max-width: 320px; line-height: 1.4; }
    .hero-scroll { font-size: .65rem; letter-spacing: .25em; text-transform: uppercase; color: var(--plum-soft); opacity: .5; }

    .section-label { 
      font-size: .65rem; 
      letter-spacing: .3em; 
      text-transform: uppercase; 
      color: var(--pink); 
      padding-top: .5rem; 
    }

    /* ABOUT SECTION */
    #about {
      padding: 6rem clamp(2rem, 7vw, 5rem) 6rem clamp(2.5rem, 8vw, 6rem);
      display: grid; grid-template-columns: 200px 1fr;
      gap: 4rem; border-top: 1px solid var(--line);
      position: relative; z-index: 2;
    }

    .about-h2 { font-family: var(--f-disp); font-size: clamp(2.2rem, 4vw, 3.5rem); font-weight: 300; line-height: 1.15; margin-bottom: 2rem; }
    .about-h2 em { font-style: italic; color: var(--rose); }

    .about-body { font-size: 1.05rem; line-height: 1.9; color: var(--espresso); max-width: 720px; font-weight: 300; }
    .about-body p { margin-bottom: 1.5rem; }
    .about-highlight { 
      font-family: var(--f-ser); font-style: italic; font-size: 1.25rem; 
      color: var(--plum); border-left: 2px solid var(--pink); 
      padding-left: 1.5rem; margin: 2rem 0; 
    }

    /* WORK SECTION */
    #work { border-top: 1px solid var(--line); position: relative; z-index: 2; }
    
    .work-intro-bar {
      padding: 4rem clamp(2rem, 7vw, 5rem) 2rem clamp(2.5rem, 8vw, 6rem);
      display: grid; grid-template-columns: 200px 1fr; gap: 4rem;
    }
    .work-title { font-family: var(--f-disp); font-size: clamp(2.8rem, 6vw, 4.5rem); font-weight: 400; font-style: italic; line-height: .9; }
    
    .project {
      padding: 5rem clamp(2rem, 7vw, 5rem) 6rem clamp(2.5rem, 8vw, 6rem);
      border-top: 1px solid var(--line);
      display: grid; grid-template-columns: 140px 320px 1fr; gap: 3.5rem;
    }

    .proj-client { font-size: .62rem; letter-spacing: .25em; text-transform: uppercase; color: var(--rose); margin-bottom: .3rem; }
    .proj-name { font-family: var(--f-disp); font-size: clamp(2rem, 3.2vw, 3rem); font-weight: 400; line-height: 1.1; margin-bottom: .8rem; }
    
    .proj-tags { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1.5rem; }
    .tag { font-size: .58rem; letter-spacing: .15em; text-transform: uppercase; border: 1px solid var(--line); padding: .28rem .65rem; color: var(--plum-soft); background: rgba(255,255,255,0.5); }

    .proj-brief { font-size: .95rem; color: var(--espresso); line-height: 1.85; margin-bottom: 1.4rem; }
    .proj-concept { font-size: .85rem; color: var(--plum-soft); line-height: 1.75; padding-left: 1rem; border-left: 2px solid var(--pink); }

    /* MEDIA GRIDS */
    .media-grid { display: grid; gap: 1.5rem; width: 100%; align-items: start; }
    .media-grid.grid-1 { grid-template-columns: 1fr; }
    .media-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
    .media-grid.grid-3 { grid-template-columns: repeat(3, 1fr); }

    .media-card {
      position: relative;
      background: transparent;
      border: none;
      box-shadow: none;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .media-card img, .media-card video {
      width: 100%; height: 100%; display: block; object-fit: cover;
    }

    .media-card.span-full { grid-column: 1 / -1; }

    /* Custom Crops */
    .crop-top-2px { clip-path: inset(2px 0 0 0); }
    .crop-top-bottom-2px { clip-path: inset(2px 0 2px 0); }
    .crop-left-2px { clip-path: inset(0 0 0 2px); }

    /* Pupchen Balanced Aspect Ratio Styles */
    .pupchen-grid .media-card {
      aspect-ratio: 4 / 5;
      border-radius: 2px;
    }
    .pupchen-grid .media-card.span-full {
      aspect-ratio: 16 / 9;
    }

    /* CONTACT SECTION */
    #contact {
      background: linear-gradient(135deg, var(--plum), var(--espresso));
      padding: 8rem clamp(2rem, 7vw, 5rem); position: relative; overflow: hidden;
      color: var(--peach); z-index: 2; border-top: 1px solid var(--line);
    }

    #contact::before {
      content: 'ご連絡'; position: absolute; right: 1rem; bottom: -2rem;
      font-family: var(--f-jp); font-size: clamp(10rem, 20vw, 22rem); font-weight: 200;
      color: rgba(255,240,210,.025); pointer-events: none; line-height: 1;
    }

    .contact-inner { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: end; }
    .contact-h2 { font-family: var(--f-disp); font-size: clamp(3rem, 7vw, 7.5rem); font-weight: 400; font-style: italic; line-height: .9; color: var(--peach); }
    .contact-h2 em { color: var(--pink); font-style: normal; }
    .contact-h2 span { display: block; font-family: var(--f-jp); font-weight: 300; font-style: normal; font-size: clamp(1.1rem, 2vw, 1.8rem); color: var(--mint); margin-top: 1rem; letter-spacing: .15em; }

    .contact-body { display: flex; flex-direction: column; gap: 1.8rem; }
