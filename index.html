<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rina Benamar — Graphic Designer & Art Director</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;0,6..96,400;0,6..96,500;1,6..96,300;1,6..96,400;1,6..96,500&family=IM+Fell+English:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400&family=Noto+Serif+JP:wght@200;300;400&family=Caveat:wght@400;500&display=swap" rel="stylesheet" />
  <style>

    /* ── TOKENS ── */
    :root {
      --peach:      #FAF6F0;
      --peach-mid:  #F2ECE1;
      --espresso:   #351E28;
      --plum:       #5B1E32;
      --plum-soft:  #4D3449;
      --olive:      #6C6A43;
      --pink:       #CB438B;
      --rose:       #BF3556;
      --mint:       #B7E1DA;
      --line:       rgba(53,30,40,.13);
      --line-lt:    rgba(53,30,40,.07);
      --f-disp:     'Bodoni Moda', Georgia, serif;
      --f-ser:      'IM Fell English', Georgia, serif;
      --f-body:     'DM Sans', sans-serif;
      --f-jp:       'Noto Serif JP', serif;
      --f-hand:     'Caveat', cursive;
      --ease:       cubic-bezier(0.16,1,0.3,1);
      --space-xs:   0.4rem;
      --space-sm:   0.8rem;
      --space-md:   1.5rem;
      --space-lg:   3.5rem;
    }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      background:var(--peach);
      color:var(--espresso);
      font-family:var(--f-body);
      font-weight:300;
      line-height:1.7;
      cursor:none;
      overflow-x:hidden;
    }

    /* grain overlay */
    body::after {
      content:'';
      position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity:.036; pointer-events:none; z-index:9000;
    }

    /* ── CURSOR ── */
    #cursor {
      position:fixed; width:9px; height:9px;
      background:var(--pink); border-radius:50%;
      pointer-events:none; z-index:9999;
      transform:translate(-50%,-50%);
      transition:width .35s var(--ease),height .35s var(--ease),background .3s;
      mix-blend-mode:multiply;
    }
    #cursor.big { width:50px; height:50px; background:var(--mint); opacity:.65; }
    #cursor-ring {
      position:fixed; width:32px; height:32px;
      border:1.5px solid rgba(203,67,139,.3); border-radius:50%;
      pointer-events:none; z-index:9998;
      transform:translate(-50%,-50%);
      transition:left .14s var(--ease),top .14s var(--ease);
    }

    /* ── NAV ── */
    nav {
      position:fixed; inset:0 0 auto; z-index:500;
      padding:1.8rem 3.5rem;
      display:flex; justify-content:space-between; align-items:center;
      background:linear-gradient(to bottom,var(--peach) 55%,transparent);
    }
    .logo { text-decoration:none; display:flex; flex-direction:column; line-height:1.2; }
    .logo-en { font-family:var(--f-disp); font-size:.9rem; font-weight:400; letter-spacing:.25em; text-transform:uppercase; color:var(--espresso); }
    .logo-jp { font-family:var(--f-jp); font-size:.54rem; font-weight:200; letter-spacing:.4em; color:var(--plum); opacity:.6; }
    .nav-links { list-style:none; display:flex; gap:2.8rem; align-items:center; }
    .nav-links a { font-size:.63rem; letter-spacing:.24em; text-transform:uppercase; text-decoration:none; color:var(--plum-soft); transition:color .3s; }
    .nav-links a:hover { color:var(--pink); }

    /* ── HERO ── */
    #hero {
      min-height:100vh;
      padding:0 var(--space-lg) var(--space-md);
      display:grid; grid-template-rows:1fr auto;
      position:relative; overflow:hidden;
    }
    .hero-img-bg {
      position:absolute; inset:0;
      background-image:url('https://rinaffff.github.io/rina-portfoliov1/assets/r_background.png');
      background-size:cover; background-position:center;
      opacity:.07; pointer-events:none;
    }
    .hero-bg-jp {
      position:absolute; right:2vw; top:50%;
      transform:translateY(-50%);
      font-family:var(--f-jp);
      font-size:clamp(9rem,28vw,26rem);
      font-weight:200; color:rgba(91,30,50,.055);
      pointer-events:none; line-height:1; user-select:none;
      writing-mode:vertical-rl;
    }
    .hero-rule {
      position:absolute; left:var(--space-lg); top:0; bottom:0;
      width:2px;
      background:linear-gradient(to bottom,transparent,var(--pink) 35%,var(--rose) 70%,transparent);
      opacity:.17;
    }
    .hero-center {
      display:flex; flex-direction:column; justify-content:flex-end;
      padding-bottom:5rem; padding-left:2.5rem;
    }
    .hero-eyebrow {
      font-family:var(--f-hand); font-size:1.2rem; color:var(--pink);
      margin-bottom:1.2rem;
      opacity:0; animation:up .9s var(--ease) .3s forwards;
    }
    .hero-h1 {
      font-family:var(--f-disp);
      font-size:clamp(4rem,12vw,12rem);
      font-weight:400; line-height:.88; letter-spacing:-.025em;
      opacity:0; animation:up 1.1s var(--ease) .45s forwards;
      margin-bottom:.8rem;
    }
    .hero-h1 .it { font-style:italic; }
    .hero-h1 .pk { color:var(--pink); }
    .hero-h1 .ol { color:var(--olive); font-style:italic; }
    .hero-sub {
      display:flex; align-items:baseline; gap:2.5rem; margin-top:2rem;
      opacity:0; animation:up .9s var(--ease) .75s forwards;
    }
    .hero-tagline { font-family:var(--f-ser); font-size:clamp(.82rem,1.4vw,1.1rem); font-style:italic; line-height:1.7; max-width:400px; color:var(--plum-soft); }
    .hero-jp-tag  { font-family:var(--f-jp); font-size:.62rem; font-weight:200; letter-spacing:.35em; color:var(--pink); opacity:.65; white-space:nowrap; }
    .hero-foot {
      display:flex; justify-content:space-between; align-items:center;
      border-top:1px solid var(--line); padding-top:1.4rem; margin-left:2.5rem;
      opacity:0; animation:up .8s var(--ease) 1.1s forwards;
    }
    .hero-foot-l { display:flex; flex-direction:column; gap:.28rem; }
    .hero-location { font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--plum-soft); opacity:.5; }
    .hero-avail    { font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--pink); }
    .hero-scroll   { display:flex; align-items:center; gap:.7rem; font-size:.58rem; letter-spacing:.22em; text-transform:uppercase; color:var(--plum-soft); opacity:.4; }
    .scroll-line   { display:block; width:0; height:1px; background:var(--pink); animation:grow 1.2s var(--ease) 1.5s forwards; }
    @keyframes grow { to { width:48px; } }

    /* ── STATEMENT BAND ── */
    .statement-band {
      background:linear-gradient(135deg,var(--plum),var(--espresso));
      padding:4.5rem var(--space-lg); position:relative; overflow:hidden;
    }
    .statement-inner { position:relative; display:grid; grid-template-columns:1fr auto; align-items:center; gap:3rem; }
    .statement-text { font-family:var(--f-disp); font-size:clamp(1.3rem,2.8vw,2.6rem); font-weight:300; font-style:italic; color:var(--peach); line-height:1.4; }
    .statement-text em { font-style:normal; color:var(--mint); }
    .statement-jp { font-family:var(--f-jp); font-size:.7rem; font-weight:200; letter-spacing:.38em; color:var(--mint); opacity:.5; writing-mode:vertical-rl; white-space:nowrap; }

    /* ── MARQUEE ── */
    .marquee-wrap { overflow:hidden; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:1.1rem 0; background:var(--peach-mid); }
    .marquee-track { display:flex; gap:3rem; white-space:nowrap; animation:marquee 22s linear infinite; }
    .marquee-item  { display:flex; align-items:center; gap:3rem; flex-shrink:0; }
    .m-en  { font-family:var(--f-disp); font-style:italic; font-size:.95rem; color:var(--espresso); opacity:.38; }
    .m-jp  { font-family:var(--f-jp); font-size:.68rem; font-weight:200; letter-spacing:.28em; color:var(--pink); opacity:.42; }
    .m-dot { width:4px; height:4px; border-radius:50%; background:var(--pink); opacity:.38; flex-shrink:0; }
    @keyframes marquee { to { transform:translateX(-50%); } }

    /* ── WORK ── */
    #work { border-top:1px solid var(--line); }
    .work-header { padding:4rem var(--space-lg) 5.5rem; display:flex; justify-content:space-between; align-items:flex-end; }
    .work-title { font-family:var(--f-disp); font-size:clamp(3rem,7vw,7rem); font-weight:400; font-style:italic; line-height:.9; }
    .work-title span { display:block; font-family:var(--f-hand); font-style:normal; font-size:clamp(1.1rem,2.5vw,2.5rem); color:var(--pink); margin-top:.4rem; }

    /* ── PROJECT ── */
    .project {
      padding:5rem var(--space-lg);
      border-top:1px solid var(--line);
      display:grid;
      grid-template-columns:60px 320px 1fr;
      gap: var(--space-lg);
      align-items:start;
      opacity:0; transform:translateY(40px);
      transition:opacity .9s var(--ease),transform .9s var(--ease);
    }
    .project.in { opacity:1; transform:translateY(0); }
    .project:nth-child(odd) { background:rgba(53,30,40,.022); }

    .proj-num     { font-family:var(--f-jp); font-size:.68rem; font-weight:200; color:var(--pink); opacity:.45; padding-top:.5rem; letter-spacing:.12em; }
    .proj-client  { font-size:.59rem; letter-spacing:.28em; text-transform:uppercase; color:var(--rose); margin-bottom:.5rem; }
    .proj-name    { font-family:var(--f-disp); font-size:clamp(1.6rem,2.8vw,2.6rem); font-weight:400; line-height:1.1; margin-bottom:.4rem; }
